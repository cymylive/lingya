<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LingYa · Logo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0A0E17;
    --fg: #FFFFFF;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    background: var(--bg);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .logo { width: 190px; height: 190px; color: var(--fg); }
  .logo svg { width: 100%; height: 100%; display: block; }

  .brand {
    font-size: 24px;
    letter-spacing: 10px;
    font-weight: 700;
    color: var(--fg);
    text-indent: 10px;
  }

  .slogan {
    font-size: 11px;
    letter-spacing: 7px;
    color: rgba(255,255,255,0.35);
    text-indent: 7px;
  }
</style>
</head>
<body>

  <div class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" aria-label="LingYa">
      <!-- 灵鸦：鸦头剪影 -->
      <g fill="currentColor">
        <!-- 冠羽 -->
        <polygon points="87,77 77,36 102,72"/>
        <polygon points="108,72 108,31 128,69"/>
        <!-- 后脑 + 头 -->
        <ellipse cx="100" cy="110" rx="44" ry="44"/>
        <ellipse cx="123" cy="141" rx="62" ry="64"/>
        <!-- 上喙 / 下喙 -->
        <polygon points="161,118 246,141 164,154"/>
        <polygon points="164,161 225,154 169,179"/>
      </g>
      <!-- 眼睛（挖空） -->
      <circle cx="125" cy="123" r="15" fill="#0A0E17"/>
    </svg>
  </div>

  <div class="brand">LINGYA</div>
  <div class="slogan">灵 鸦 入 幕</div>

</body>
</html>
