<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:transparent;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  :root {
    --bg:#14181c; --surface:rgba(255,255,255,0.05); --hover:rgba(255,255,255,0.10);
    --border:rgba(255,255,255,0.10); --text:#e2e8f0; --text2:#cbd5e1; --dim:#7c8798;
    --primary:#2dd4bf; --primary-soft:rgba(45,212,191,0.16); --title:#ccfbf1;
  }
  html.light {
    --bg:#ffffff; --surface:rgba(0,0,0,0.03); --hover:rgba(0,0,0,0.07);
    --border:rgba(0,0,0,0.12); --text:#1e293b; --text2:#334155; --dim:#64748b;
    --primary:#0d9488; --primary-soft:rgba(13,148,136,0.14); --title:#0f766e;
  }
  #panel {
    width:100%; height:100%; display:flex; flex-direction:column;
    background:var(--bg); border:1px solid var(--border); border-radius:10px;
    box-shadow:0 12px 40px rgba(0,0,0,0.5); overflow:hidden;
  }
  .head { display:flex; align-items:center; justify-content:space-between;
    padding:8px 12px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .title { font-size:12px; font-weight:700; color:var(--title); }
  .count { display:inline-block; min-width:18px; padding:0 5px; margin-left:5px;
    background:var(--primary-soft); color:var(--primary); border-radius:8px;
    font-size:10px; text-align:center; line-height:16px; }
  .close { width:22px; height:22px; border:none; background:transparent; cursor:pointer;
    color:var(--dim); border-radius:5px; font-size:14px; line-height:1; }
  .close:hover { background:var(--hover); color:var(--text); }
  .body { flex:1; overflow-y:auto; padding:4px; }
  .body::-webkit-scrollbar { width:6px; }
  .body::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  .row { display:flex; align-items:center; gap:6px; padding:7px 10px; border-radius:6px;
    font-size:12px; color:var(--text2); }
  .row:hover { background:var(--hover); }
  .row .wno { font-weight:600; color:var(--text); min-width:60px; }
  .row .lbl { font-size:11px; color:var(--dim); }
  .row .val { color:var(--text); font-variant-numeric:tabular-nums; font-weight:600; }
  .row .sp { flex:1; }
  .empty { padding:24px 10px; text-align:center; color:var(--dim); font-size:12px; }
  .foot { display:flex; align-items:center; gap:6px; padding:8px 12px;
    border-top:1px solid var(--border); flex-shrink:0; font-size:11px; }
  .foot .info { color:var(--dim); margin-right:auto; }
  .foot select { width:64px; padding:3px 4px; border-radius:5px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); text-align:center; font-size:11.5px;
    outline:none; cursor:pointer; appearance:none; -webkit-appearance:none; }
  .foot select:focus { border-color:var(--primary); }
  .foot .pg { color:var(--dim); white-space:nowrap; }
</style>
</head>
<body>
<div id="panel">
  <div class="head">
    <span class="title" id="ttl">全部窗口<span class="count" id="cnt">0</span></span>
    <button class="close" id="btn-close" title="关闭">×</button>
  </div>
  <div id="body" class="body"></div>
  <div id="foot" class="foot" style="display:none;">
    <span class="info" id="range">-</span>
    <select id="page-select" title="选择页码"></select>
    <span class="pg" id="page-total">/ 1 页</span>
  </div>
</div>
<script>
  var PAGE_SIZE = 10;
  var allItems = [];
  var currentPage = 1;

  function formatToken(n) {
    if (typeof n !== 'number' || !isFinite(n) || n <= 0) return '0';
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
    return String(Math.round(n));
  }

  function render() {
    var total = allItems.length;
    document.getElementById('cnt').textContent = String(total);
    var body = document.getElementById('body');
    var foot = document.getElementById('foot');
    if (!total) {
      body.innerHTML = '<div class="empty">暂无窗口数据</div>';
      foot.style.display = 'none';
      return;
    }
    var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (currentPage < 1) currentPage = 1;
    if (currentPage > totalPages) currentPage = totalPages;
    var start = (currentPage - 1) * PAGE_SIZE;
    var end = Math.min(start + PAGE_SIZE, total);

    var h = '';
    for (var i = start; i < end; i++) {
      var it = allItems[i] || {};
      var wno = it.winNo != null ? it.winNo + '号窗口' : '窗口?';
      var tok = formatToken(it.tokens);
      var tps = (it.tps && it.tps !== '--') ? it.tps : '--';
      h += '<div class="row">'
        + '<span class="wno">' + wno + '</span>'
        + '<span class="lbl">对话上下文:</span><span class="val">' + tok + '</span>'
        + '<span class="lbl" style="margin-left:10px;">输出速度:</span><span class="val">' + tps + '</span>'
        + '</div>';
    }
    body.innerHTML = h;

    foot.style.display = 'flex';
    document.getElementById('range').textContent = (start + 1) + '-' + end + ' / ' + total;
    // 生成页码下拉列表
    var sel = document.getElementById('page-select');
    var opts = '';
    for (var p = 1; p <= totalPages; p++) {
      opts += '<option value="' + p + '"' + (p === currentPage ? ' selected' : '') + '>' + p + '</option>';
    }
    sel.innerHTML = opts;
    document.getElementById('page-total').textContent = '/ ' + totalPages + ' 页';
  }

  window.dropdownAPI.onInit(function(payload) {
    var d = (payload && payload.data) || {};
    allItems = Array.isArray(d.items) ? d.items : [];
    var theme = (payload && payload.theme) || 'dark';
    if (theme === 'light') document.documentElement.classList.add('light');
    render();
  });

  document.getElementById('btn-close').addEventListener('click', function() {
    window.dropdownAPI.close();
  });

  document.getElementById('page-select').addEventListener('change', function() {
    var v = parseInt(this.value, 10);
    if (!isFinite(v) || v < 1) return;
    currentPage = v;
    render();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') window.dropdownAPI.close();
  });
</script>
</body>
</html>
