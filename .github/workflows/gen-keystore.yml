name: Generate Android Keystore (One-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing keystore
        id: check
        run: |
          if [ -f android/app/lingya-release.keystore ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "keystore already exists, will skip generation"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "no keystore, will generate"
          fi

      - name: Setup JDK 21
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate keystore
        if: steps.check.outputs.exists == 'false'
        run: |
          keytool -genkeypair -v \
            -keystore android/app/lingya-release.keystore \
            -alias lingya \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass lingya-remote-2026 \
            -keypass lingya-remote-2026 \
            -dname "CN=Lingya Remote, OU=Mobile, O=Lingya, L=Beijing, ST=Beijing, C=CN"
          echo "keystore generated"

      - name: Encode base64
        if: steps.check.outputs.exists == 'false'
        id: encode
        run: |
          B64=$(base64 -w 0 android/app/lingya-release.keystore)
          echo "$B64" > keystore.b64
          echo "b64_length=${#B64}" >> "$GITHUB_OUTPUT"
          echo "----- Job Summary 下方可直接复制 -----"

      - name: Write to Job Summary
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "## Android Keystore 已生成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 1. 复制下面的 base64 到 GitHub Secrets" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Secret 名：`ANDROID_KEYSTORE_BASE64`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          cat keystore.b64 >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 2. 另外三个 Secrets" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret 名 | 值 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| `ANDROID_KEYSTORE_PASSWORD` | `lingya-remote-2026` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| `ANDROID_KEY_ALIAS` | `lingya` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| `ANDROID_KEY_PASSWORD` | `lingya-remote-2026` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 3. 填写入口" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/cymylive/lingya/settings/secrets/actions" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit keystore to repo
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "lingya-bot"
          git config user.email "bot@lingya.local"
          git add android/app/lingya-release.keystore
          git commit -m "chore: 添加固定签名 keystore（本地构建用；CI 优先 Secrets）"
          git push

      - name: Upload keystore artifact
        if: steps.check.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: lingya-keystore
          path: |
            android/app/lingya-release.keystore
            keystore.b64
          retention-days: 90

      - name: Already exists notice
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "## Keystore 已存在" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "仓库里已有 `android/app/lingya-release.keystore`，未重新生成。" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "如果需要重新生成，先删除该文件再跑本 workflow。" >> "$GITHUB_STEP_SUMMARY"
