name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android-app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ubuntu-latest runner 预装 Android SDK（ANDROID_HOME 已设置），
      # 不需要 android-actions/setup-android，避免其初始化失败。
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          which sdkmanager || true

      - name: Install dependencies
        working-directory: android-app
        run: npm install

      - name: Add Android platform
        working-directory: android-app
        run: npx cap add android

      - name: Apply native plugin
        working-directory: android-app
        run: npm run apply-native

      - name: Sync Capacitor
        working-directory: android-app
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lingya-android-debug
          path: android-app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
