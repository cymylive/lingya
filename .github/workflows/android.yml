name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'src/main/remote/pwa/**'
      - 'scripts/sync-android-version.js'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'src/main/remote/pwa/**'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync Android version
        run: node scripts/sync-android-version.js

      - name: Diagnose Capacitor
        run: |
          echo "--- node_modules/@capacitor ---"
          ls -la node_modules/@capacitor/ || true
          echo "--- cap cli version ---"
          node -e "console.log(require('@capacitor/cli/package.json').version)" || true
          echo "--- webDir exists ---"
          ls -la src/main/remote/pwa/ | head -5 || true

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/lingya-release.keystore
            echo "keystore restored from secrets"
          else
            echo "no keystore secret, using debug signing"
          fi

      - name: Sync Capacitor
        run: npx cap sync android 2>&1

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lingya-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  release-apk:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync Android version
        run: node scripts/sync-android-version.js

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/lingya-release.keystore
            echo "keystore restored from secrets"
          else
            echo "no keystore secret, using debug signing"
          fi

      - name: Sync Capacitor
        run: npx cap sync android 2>&1

      - name: Build Release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: lingya-android-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
