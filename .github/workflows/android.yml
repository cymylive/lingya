name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android-app/**'
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: android-app
        run: npm install

      - name: Add Android platform
        working-directory: android-app
        run: npx cap add android

      - name: Apply native plugin
        working-directory: android-app
        run: npm run apply-native

      - name: Sync Capacitor
        working-directory: android-app
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lingya-android-debug
          path: android-app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
