name: Build Electron Apps

# 仅做 push/PR 到 main 时的构建验证 + 上传 artifact。
# 发布由 release.yml（tag v* 触发）负责，此处不再重复发布。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install
      - run: npm run build:win:local
      - uses: actions/upload-artifact@v5
        with:
          name: Windows-build
          path: dist/

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install
      - run: npm run build:mac:local
      - uses: actions/upload-artifact@v5
        with:
          name: macOS-build
          path: dist/
